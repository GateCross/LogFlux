Name: logflux-api
Host: 0.0.0.0
Port: 8888
Auth:
  AccessSecret: "L0gFlux@2024!Secure#JWT$Key%Str0ng"
  AccessExpire: 86400
Database:
  Host: "host.docker.internal"  # 使用 host.docker.internal 访问主机上的数据库
  Port: 5432
  User: "postgres"
  Password: "postgres"
  DBName: "logflux"
  SSLMode: "disable"
Redis:
  Host: "host.docker.internal"  # 使用 host.docker.internal 访问主机上的 Redis
  Port: 6379
  Password: ""
  DB: 0
CaddyLogPath: "/var/log/caddy/access.log"

# 证书中心：Caddy 证书存储目录（卷扫描源），留空回退 /data/caddy/certificates
Caddy:
  CertStorageDir: "/data/caddy/certificates"

# 已废弃：归档机制已移除，日志保留策略改在系统设置里配置（存储键 caddy_log_retention，缺省 7 天）。
# 以下字段保留只为旧配置文件解析不报错，运行时不再读取。
Archive:
  Enabled: true
  RetentionDay: 90
  ArchiveTable: "caddy_logs_archive"

Waf:
  WorkDir: "/config/security"
  FetchTimeoutSec: 180
  MaxPackageBytes: 104857600
  AllowedDomains: ["github.com", "api.github.com"]
  ExtractMaxFiles: 5000
  ExtractMaxTotalBytes: 536870912
  ReleaseRetentionCount: 20
  ActivateTimeoutSec: 30
  ActivateRetryCount: 1
  CorazaReleaseAPI: "https://api.github.com/repos/corazawaf/coraza-caddy/releases/latest"
  CorazaCurrentVersion: ""
  CorazaCheckProxy: ""

IPRegion:
  Enabled: true
  AllowList:
    - "中国"
