<style data-app-loading="inject-css">
  html {
    /* same as ant-design-vue/dist/reset.css setting, avoid the title line-height changed */
    line-height: 1.15;
  }

  .dark .loading {
    background-color: #0d0d10;
  }

  .loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    background-color: #f4f7f9;
  }

  .loading.hidden {
    visibility: hidden;
    opacity: 0;
    transition: all 0.6s ease-out;
  }

  .loading-text {
    margin-top: 34px;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    color: rgb(15 23 42 / 65%);
  }

  .dark .loading-text {
    color: rgb(255 255 255 / 68%);
  }

  .loading-progress {
    position: relative;
    width: 180px;
    height: 3px;
    margin-top: 14px;
    overflow: hidden;
    background: hsl(var(--primary, 210 100% 50%) / 14%);
    border-radius: 999px;
  }

  .loading-progress::after {
    position: absolute;
    inset: 0 auto 0 -45%;
    width: 45%;
    content: '';
    background: hsl(var(--primary, 210 100% 50%) / 78%);
    border-radius: inherit;
    animation: loading-progress-ani 1.4s ease-in-out infinite;
  }

  .dot {
    position: relative;
    box-sizing: border-box;
    display: inline-block;
    width: 48px;
    height: 48px;
    margin-top: 30px;
    font-size: 32px;
    transform: rotate(45deg);
    animation: rotate-ani 1.2s infinite linear;
  }

  .dot i {
    position: absolute;
    display: block;
    width: 20px;
    height: 20px;
    background-color: hsl(var(--primary, 210 100% 50%));
    border-radius: 100%;
    opacity: 0.3;
    transform: scale(0.75);
    transform-origin: 50% 50%;
    animation: spin-move-ani 1s infinite linear alternate;
  }

  .dot i:nth-child(1) {
    top: 0;
    left: 0;
  }

  .dot i:nth-child(2) {
    top: 0;
    right: 0;
    animation-delay: 0.4s;
  }

  .dot i:nth-child(3) {
    right: 0;
    bottom: 0;
    animation-delay: 0.8s;
  }

  .dot i:nth-child(4) {
    bottom: 0;
    left: 0;
    animation-delay: 1.2s;
  }

  @keyframes rotate-ani {
    to {
      transform: rotate(405deg);
    }
  }

  @keyframes spin-move-ani {
    to {
      opacity: 1;
    }
  }

  @keyframes loading-progress-ani {
    to {
      transform: translateX(320%);
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <span class="dot"><i></i><i></i><i></i><i></i></span>
  <div class="loading-text">正在准备日志工作台...</div>
  <div class="loading-progress"></div>
</div>
